<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17233f">
<meta name="robots" content="noindex">
<title>Account — StudyNest</title>
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="/assets/auth.css">
<script type="module" src="/assets/auth.js"></script>
</head>
<body data-page="auth">
<div class="app">
<header class="topbar">
  <a class="brand" href="/" aria-label="StudyNest home"><div class="brand-mark">✦</div><div>StudyNest <small>YOUR PERSONAL TEACHER</small></div></a>
  <div class="top-actions"><a class="btn btn-light btn-sm" href="/">← Back to study</a><div class="auth-controls" id="authControls"></div></div>
</header>
<main class="auth-main">
  <section class="panel auth-card" id="authCard" aria-live="polite"><div class="loading-line"><span class="btn-spin dark"></span> Loading…</div></section>
  <noscript><p class="auth-noscript">Please enable JavaScript to use accounts. StudyNest still works without an account.</p></noscript>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

</html>
