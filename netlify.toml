[build]
  command = "npm run build"
  publish = "dist"

# Account pages are all served by one page shell; src/auth.js picks the view from the URL.
[[redirects]]
  from = "/login"
  to = "/auth.html"
  status = 200
[[redirects]]
  from = "/signup"
  to = "/auth.html"
  status = 200
[[redirects]]
  from = "/forgot-password"
  to = "/auth.html"
  status = 200
[[redirects]]
  from = "/reset-password"
  to = "/auth.html"
  status = 200
[[redirects]]
  from = "/account"
  to = "/auth.html"
  status = 200
