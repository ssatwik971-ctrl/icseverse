[build]
  command = "npm run build"
  publish = "dist"

# Account pages are all served by one page shell; src/auth.js picks the view from the URL.
[[redirects]]
  from = "/login"
  to = "/auth.html"
  status = 200
[[redirects]]
  from = "/signup"
  to = "/auth.html"
  status = 200
[[redirects]]
  from = "/forgot-password"
  to = "/auth.html"
  status = 200
[[redirects]]
  from = "/reset-password"
  to = "/auth.html"
  status = 200
[[redirects]]
  from = "/account"
  to = "/auth.html"
  status = 200

# Admin page (the page itself shows "Page not found" to anyone who is not the admin) and the banned page.
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
[[redirects]]
  from = "/banned"
  to = "/banned.html"
  status = 200

# The service worker must always be revalidated so updates reach students quickly.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Safety headers for every page. The Content-Security-Policy only blocks things that are never needed
# (framing the site, plugins, a changed <base>). It does not limit scripts, so Puter AI and KaTeX keep working.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy = "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
